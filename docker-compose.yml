services:
  db:
    image: pgvector/pgvector:pg16 # postgres 16 kem san extension vector (RAG)
    container_name: realestate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: realestate-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      # Trong container, backend duoc goi bang ten service, khong dung localhost
      BACKEND_URL: http://backend:8081
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      # Bot Telegram bao nhan vien (sub-workflow thong-bao-nhan-vien). De trong thi chi gui email
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_SALE_CHAT_ID: ${TELEGRAM_SALE_CHAT_ID:-}
      # Bot Telegram cho khach (luong 6), tach rieng bot sale. Secret de Telegram ky webhook
      TELEGRAM_KHACH_BOT_TOKEN: ${TELEGRAM_KHACH_BOT_TOKEN:-}
      TELEGRAM_KHACH_WEBHOOK_SECRET: ${TELEGRAM_KHACH_WEBHOOK_SECRET:-}
      # Tai khoan API Mautic cho luong 7 (Basic auth)
      MAUTIC_API_USER: ${MAUTIC_API_USER:-}
      MAUTIC_API_PASSWORD: ${MAUTIC_API_PASSWORD:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n

  backend:
    build: ./backend
    container_name: realestate-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/viewing-requested
      N8N_LEAD_CHANGED_URL: ${N8N_LEAD_CHANGED_URL:-http://n8n:5678/webhook/lead-changed}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
      BOOKING_RATE_LIMIT: ${BOOKING_RATE_LIMIT:-5}
      BOOKING_RATE_TTL_MS: ${BOOKING_RATE_TTL_MS:-600000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      PORT: 8081
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081/api}
        NEXT_PUBLIC_MAUTIC_URL: ${NEXT_PUBLIC_MAUTIC_URL:-http://localhost:8082}
    container_name: realestate-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081/api}
      NEXT_PUBLIC_MAUTIC_URL: ${NEXT_PUBLIC_MAUTIC_URL:-http://localhost:8082}
    depends_on:
      - backend

volumes:
  db_data:
  n8n_data:
