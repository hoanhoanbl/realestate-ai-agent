services:
  db:
    image: postgres:16
    container_name: realestate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: realestate-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      # Trong container, backend duoc goi bang ten service, khong dung localhost
      BACKEND_URL: http://backend:8081
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      # Bot Telegram bao nhan vien (sub-workflow thong-bao-nhan-vien). De trong thi chi gui email
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_SALE_CHAT_ID: ${TELEGRAM_SALE_CHAT_ID:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n

  backend:
    build: ./backend
    container_name: realestate-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/viewing-requested
      N8N_LEAD_CHANGED_URL: ${N8N_LEAD_CHANGED_URL:-http://n8n:5678/webhook/lead-changed}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
      PORT: 8081
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    container_name: realestate-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8081/api
    depends_on:
      - backend

volumes:
  db_data:
  n8n_data:

