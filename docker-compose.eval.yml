# FE-24: máy chủ SMTP giả để đo chấm điểm AI mà không có thư nào ra ngoài.
# Chạy:  docker compose -f docker-compose.eval.yml up -d
# Giao diện xem thư: http://localhost:8025   |   SMTP cho n8n: host mailpit, cổng 1025, không mã hoá, không user/password
# Dừng và xoá thư:   docker compose -f docker-compose.eval.yml down
# Chỉ dùng trên máy local; không đưa vào docker-compose.prod.yml.
services:
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: realestate-mailpit
    restart: "no"
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

networks:
  default:
    # Dùng chung mạng với stack chính để container n8n gọi được "mailpit:1025"
    name: realestate-ai-agent_default
    external: true
